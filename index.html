<!DOCTYPE html>
<html>

<head>
    <title>3 Phase Load Calculator</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 15px;
        }

        .calculator {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        .phase {
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
        }

        .r-phase {
            background: #ff0000;
        }

        .y-phase {
            background: #fff000;
        }

        .b-phase {
            background: #87ceeb;
        }

        h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .calculate {
            background: #222;
            color: white;
        }

        .reset {
            background: #ddd;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            background: #eeeeee;
            border-radius: 10px;
            text-align: center;
        }

        .mw {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .pf {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>
</head>


<body>

<div class="calculator">

    <h1>3 Phase Load Calculator</h1>

    <div class="pf">
        Power Factor = 0.96
    </div>


    <!-- R PHASE -->

    <div class="phase r-phase">

        <h3>R Phase</h3>

        <label>Voltage (kV)</label>

        <input type="number"
               id="vr"
               step="0.01"
               placeholder="Enter Voltage">


        <label>Current (A)</label>

        <input type="number"
               id="ir"
               step="0.01"
               placeholder="Enter Current">

    </div>


    <!-- Y PHASE -->

    <div class="phase y-phase">

        <h3>Y Phase</h3>

        <label>Voltage (kV)</label>

        <input type="number"
               id="vy"
               step="0.01"
               placeholder="Enter Voltage">


        <label>Current (A)</label>

        <input type="number"
               id="iy"
               step="0.01"
               placeholder="Enter Current">

    </div>


    <!-- B PHASE -->

    <div class="phase b-phase">

        <h3>B Phase</h3>

        <label>Voltage (kV)</label>

        <input type="number"
               id="vb"
               step="0.01"
               placeholder="Enter Voltage">


        <label>Current (A)</label>

        <input type="number"
               id="ib"
               step="0.01"
               placeholder="Enter Current">

    </div>


    <button class="calculate"
            onclick="calculate()">

        CALCULATE

    </button>


    <button class="reset"
            onclick="resetForm()">

        RESET

    </button>


    <div class="result">

        <div id="averageVoltage">
            Average Voltage = -
        </div>

        <div id="averageCurrent">
            Average Current = -
        </div>

        <div class="mw" id="totalMW">
            Total Load = -
        </div>

    </div>

</div>


<script>

function calculate() {

    let vr = Number(document.getElementById("vr").value);
    let ir = Number(document.getElementById("ir").value);

    let vy = Number(document.getElementById("vy").value);
    let iy = Number(document.getElementById("iy").value);

    let vb = Number(document.getElementById("vb").value);
    let ib = Number(document.getElementById("ib").value);


    // Average Voltage

    let averageVoltage =
        (vr + vy + vb) / 3;


    // Average Current

    let averageCurrent =
        (ir + iy + ib) / 3;


    // Fixed Power Factor

    let pf = 0.95;


    // Total MW

    let totalMW =
        Math.sqrt(3) *
        averageVoltage *
        averageCurrent *
        pf / 1000;


    // Display Result

    document.getElementById("averageVoltage").innerHTML =
        "Average Voltage = "
        + averageVoltage.toFixed(2)
        + " kV";


    document.getElementById("averageCurrent").innerHTML =
        "Average Current = "
        + averageCurrent.toFixed(2)
        + " A";


    document.getElementById("totalMW").innerHTML =
        "Total Load = "
        + totalMW.toFixed(2)
        + " MW";

}


function resetForm() {

    document.getElementById("vr").value = "";
    document.getElementById("ir").value = "";

    document.getElementById("vy").value = "";
    document.getElementById("iy").value = "";

    document.getElementById("vb").value = "";
    document.getElementById("ib").value = "";


    document.getElementById("averageVoltage").innerHTML =
        "Average Voltage = -";

    document.getElementById("averageCurrent").innerHTML =
        "Average Current = -";

    document.getElementById("totalMW").innerHTML =
        "Total Load = -";

}

</script>

</body>

</html>
